name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm install
        run: |
          npm install --no-audit --no-fund > npm.log 2>&1 || { grep -iE "npm error|ERESOLVE|peer|notarget" npm.log | head -20 | sed 's/^/::error::/'; exit 1; }
      - name: type-check
        run: |
          npm run type-check > tsc.log 2>&1 || { grep -E "error TS" tsc.log | head -30 | sed 's/^/::error::/'; exit 1; }

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          preCommands: npx wrangler d1 migrations apply neutra --remote
          command: deploy
          secrets: |
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            COOKIE_ENCRYPTION_KEY
            ALLOWED_EMAILS
            INVITER_REFRESH_TOKEN
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          COOKIE_ENCRYPTION_KEY: ${{ secrets.COOKIE_ENCRYPTION_KEY }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          INVITER_REFRESH_TOKEN: ${{ secrets.INVITER_REFRESH_TOKEN }}
