name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: npm install
        run: |
          { if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi; } > npm.log 2>&1 || { grep -iE "npm error|ERESOLVE|peer|notarget" npm.log | head -20 | sed 's/^/::error::/'; exit 1; }
      - name: type-check
        run: |
          npm run type-check > tsc.log 2>&1 || { grep -E "error TS" tsc.log | head -30 | sed 's/^/::error::/'; exit 1; }
      - name: tests
        run: |
          npm test > test.log 2>&1 || {
            # One annotation (GitHub shows at most 10, and cuts long ones): the failures first, without the
            # log noise of passing tests, so the reason is visible on the PR.
            msg=$(sed 's/\x1b\[[0-9;]*m//g' test.log | grep -v -E "^\s*$|^(stdout|stderr) \||^\{\"job\"|^\s+at " | grep -A 25 -E "FAIL|AssertionError|Error:|×" | head -c 6000 | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
            echo "::error title=tests::$msg"
            exit 1
          }

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          preCommands: npx wrangler d1 migrations apply neutra --remote
          command: deploy
          secrets: |
            GOOGLE_CLIENT_ID
            GOOGLE_CLIENT_SECRET
            COOKIE_ENCRYPTION_KEY
            ALLOWED_EMAILS
            INVITER_REFRESH_TOKEN
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          COOKIE_ENCRYPTION_KEY: ${{ secrets.COOKIE_ENCRYPTION_KEY }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          INVITER_REFRESH_TOKEN: ${{ secrets.INVITER_REFRESH_TOKEN }}
