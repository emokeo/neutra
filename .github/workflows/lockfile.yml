name: Create lockfile

# Run by hand once (and whenever dependencies change): opens a PR with an updated package-lock.json.
# With the lockfile in main, every build installs exactly the same dependency versions (npm ci).
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --no-audit --no-fund
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1 && { echo "::notice::Lockfile already up to date."; exit 0; }
          branch="lockfile-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add package-lock.json
          git commit -m "Add/update package-lock.json"
          git push origin "$branch"
          gh pr create --title "Lockfile: pin dependency versions" --body "Generated by the Create lockfile workflow. With it, CI and deploys use \`npm ci\`. Note: PRs opened by this bot don't start the check automatically; push an empty commit or close and reopen to run it." --base main --head "$branch"
