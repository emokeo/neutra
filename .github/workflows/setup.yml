name: One-time Cloudflare setup

# Run by hand once: creates the D1 database and the KV namespace,
# and reports their IDs as annotations so they can go into wrangler.jsonc.
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Create D1 database
        run: |
          npx wrangler d1 create neutra > d1.log 2>&1 || true
          npx wrangler d1 list --json > d1.json 2>/dev/null || true
          id=$(node -e "const l=JSON.parse(require('fs').readFileSync('d1.json','utf8')||'[]');const d=l.find(x=>x.name==='neutra');console.log(d?d.uuid:'')")
          if [ -n "$id" ]; then echo "::notice::D1 neutra id=$id"; else echo "::error::$(tr '\n' ' ' < d1.log | cut -c1-400)"; exit 1; fi
      - name: Create KV namespace
        run: |
          npx wrangler kv namespace create OAUTH_KV > kv.log 2>&1 || true
          npx wrangler kv namespace list > kv.json 2>/dev/null || true
          id=$(node -e "const l=JSON.parse(require('fs').readFileSync('kv.json','utf8')||'[]');const k=l.find(x=>/OAUTH_KV/.test(x.title));console.log(k?k.id:'')")
          if [ -n "$id" ]; then echo "::notice::KV OAUTH_KV id=$id"; else echo "::error::$(tr '\n' ' ' < kv.log | cut -c1-400)"; exit 1; fi
