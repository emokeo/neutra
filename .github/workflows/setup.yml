name: One-time Cloudflare setup

# Run by hand once: creates the D1 database and the KV namespace,
# and reports their IDs as annotations so they can go into wrangler.jsonc.
on:
  workflow_dispatch:
    inputs:
      recreate_d1:
        description: "Delete the existing 'neutra' D1 database first (only while it is empty)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Create D1 database and KV namespace
        shell: bash {0}
        run: |
          report() { tr '\n' ' ' < "$1" | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-600; }
          if [ "${{ inputs.recreate_d1 }}" = "true" ]; then
            old=$(npx wrangler d1 list --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s||'[]').find(x=>x.name==='neutra'&&!x.jurisdiction);console.log(d?d.uuid:'')})")
            curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/9e1f03747e81e14938c2d2f78d9ac40d/d1/database/$old" > d1del.log 2>&1
            echo "::notice::d1 delete: $(report d1del.log)"
          fi
          # EU jurisdiction: the data stays in the EU.
          npx wrangler d1 create neutra --jurisdiction eu > d1.log 2>&1
          echo "::notice::d1 create: $(report d1.log)"
          npx wrangler d1 list --json > d1.json 2> d1.err
          echo "::notice::d1 list: $(report d1.json) $(report d1.err)"
          npx wrangler kv namespace create OAUTH_KV > kv.log 2>&1
          echo "::notice::kv create: $(report kv.log)"
          npx wrangler kv namespace list > kv.json 2> kv.err
          echo "::notice::kv list: $(report kv.json) $(report kv.err)"
