name: Stats

# Run by hand: prints the 14-day funnel from scripts/funnel.sql.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: npm install
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Funnel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          COOKIE_ENCRYPTION_KEY: ${{ secrets.COOKIE_ENCRYPTION_KEY }}
        run: |
          # The person IDs of you and your testers, computed like src/events.ts, so they can be left out.
          team=$(node -e "const c=require('crypto');const ids=(process.env.ALLOWED_EMAILS||'').split(',').map(e=>e.trim().toLowerCase()).filter(Boolean).map(e=>\"'\"+c.createHash('sha256').update(process.env.COOKIE_ENCRYPTION_KEY+':'+e).digest('hex').slice(0,16)+\"'\");console.log(ids.join(',')||\"''\")")
          sql=$(grep -v '^--' scripts/funnel.sql | sed "s/TEAM_IDS/$team/g; s/RECENT/create_time > strftime('%Y-%m-%dT%H:%M:%fZ', 'now', '-14 days')/g")
          out=$(npx wrangler d1 execute neutra --remote --json --command "$sql" 2>err.log) || { echo "::error::$( (echo "$out"; cat err.log) | tail -c 1500 | tr '\n' ' ')"; exit 1; }
          table=$(echo "$out" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const rows=JSON.parse(s).flatMap(r=>r.results);console.log(rows.map(r=>r.step+': '+r.n).join('%0A'))})")
          echo "::notice title=Funnel (14 days)::$table"
          echo "$table" | sed 's/%0A/\n/g' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
