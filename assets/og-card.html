<!doctype html><html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1200px;height:630px}
body{background:#0f5f5a;color:#fff;font-family:"Helvetica Neue",Arial,sans-serif;display:flex;align-items:center;padding:0 96px;box-sizing:border-box;gap:72px}
.logo{position:relative;width:300px;height:220px;flex:none}
.c{position:absolute;top:10px;width:200px;height:200px;border-radius:50%;border:10px solid #fff;box-sizing:border-box}
.c.a{left:0}.c.b{left:100px}
.o{position:absolute;left:100px;top:10px;width:200px;height:200px;border-radius:50%;overflow:hidden}
.o::before{content:"";position:absolute;left:-100px;top:0;width:200px;height:200px;border-radius:50%;background:#9fe0d7}
h1{font-size:96px;margin:0 0 18px;letter-spacing:-2px}
p{font-size:40px;line-height:1.25;margin:0 0 28px;color:#e2f2ef;max-width:620px}
.u{font-size:30px;color:#9fe0d7;font-weight:600}
</style></head><body>
<div class="logo"><div class="o"></div><div class="c a"></div><div class="c b"></div></div>
<div><h1>Neutra</h1><p>Find a time to meet, without sharing your calendar.</p><div class="u">neutra.day</div></div>
</body></html>
